name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 0.1.0). Ignored on tag pushes."
        required: false
        default: ""
      draft:
        description: "Create draft release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-qt-windows:
    name: Build Qt Sender (Windows)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ver="${{ github.ref_name }}"
          else
            ver="${{ inputs.version }}"
          fi
          ver="${ver#v}"
          if [ -z "$ver" ]; then ver="0.0.0-ci.${{ github.run_number }}"; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Cache OpenCV Windows
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: deps/opencv-windows
          key: opencv-4.14.0-windows-selfextract-v2

      - name: Download OpenCV Windows
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          $exe = "deps/opencv-4.14.0-windows.exe"
          curl.exe -L --retry 5 -o $exe "https://github.com/opencv/opencv/releases/download/4.14.0/opencv-4.14.0-windows.exe"
          7z x $exe "-odeps/opencv-windows" -y

      - name: Build Qt sender
        shell: pwsh
        run: |
          $cfg = Get-ChildItem deps/opencv-windows -Recurse -Filter OpenCVConfig.cmake |
            Where-Object { $_.DirectoryName -match '[\\/]build$' } |
            Select-Object -First 1
          if (-not $cfg) { throw "OpenCVConfig.cmake not found" }
          $opencv = $cfg.DirectoryName
          Write-Host "OpenCV_DIR=$opencv"
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          if (-not $env:QT_ROOT_DIR) { throw "QT_ROOT_DIR is empty" }

          cmake -S qt-sender -B qt-sender/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR;$opencv" `
            "-DOpenCV_DIR=$opencv"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build qt-sender/build --parallel
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

          $exe = "qt-sender/build/cimbar_qt_sender.exe"
          if (-not (Test-Path $exe)) { $exe = "qt-sender/build/Release/cimbar_qt_sender.exe" }
          if (-not (Test-Path $exe)) { throw "cimbar_qt_sender.exe missing" }

          $relDir = Split-Path $exe -Parent
          # Stage into a Release-like folder for packaging script
          $stage = "qt-sender/build/Release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          if ((Resolve-Path $relDir).Path -ne (Resolve-Path $stage).Path) {
            Copy-Item $exe $stage -Force
          }

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" "$stage\cimbar_qt_sender.exe" --release
          $dll = Get-ChildItem deps/opencv-windows -Recurse -Filter "opencv_world*.dll" |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]vc16[\\/]bin[\\/]' -and $_.Name -notmatch 'd\.dll$' } |
            Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem deps/opencv-windows -Recurse -Filter "opencv_world*.dll" |
              Where-Object { $_.Name -notmatch 'd\.dll$' } | Select-Object -First 1
          }
          if (-not $dll) { throw "opencv_world DLL not found" }
          Copy-Item $dll.FullName $stage -Force

      - name: Package Qt ZIP
        shell: pwsh
        run: |
          .\scripts\package-release.ps1 -Version "${{ steps.ver.outputs.version }}" -QtOnly

      - uses: actions/upload-artifact@v4
        with:
          name: qt-sender-windows
          path: dist/release/CimbarQtSender-windows-x64-*.zip
          if-no-files-found: error

  build-android:
    name: Build Android Receiver
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ver="${{ github.ref_name }}"
          else
            ver="${{ inputs.version }}"
          fi
          ver="${ver#v}"
          if [ -z "$ver" ]; then ver="0.0.0-ci.${{ github.run_number }}"; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (cmdline-tools)
        shell: bash
        run: |
          ANDROID_HOME="${{ runner.temp }}/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.14206865" "cmake;3.22.1" "platforms;android-34" "build-tools;35.0.1"

      - name: Cache OpenCV Android
        id: cache-ocv
        uses: actions/cache@v4
        with:
          path: deps/OpenCV-android-sdk
          key: opencv-4.12.0-android-sdk

      - name: Download OpenCV Android SDK
        if: steps.cache-ocv.outputs.cache-hit != 'true'
        run: |
          mkdir -p deps
          curl -L --retry 5 -o deps/opencv-android.zip \
            https://github.com/opencv/opencv/releases/download/4.12.0/opencv-4.12.0-android-sdk.zip
          unzip -q deps/opencv-android.zip -d deps

      - name: Ensure CFC web assets
        working-directory: cfc
        run: |
          if [ ! -f app/src/main/assets/index.html ]; then
            rm -rf app/src/main/assets
            git clone --depth 1 https://github.com/sz3/cimbar-js-bits.git app/src/main/assets
          fi

      - name: Configure Gradle
        run: |
          cat > cfc/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          opencvsdk=${{ github.workspace }}/deps/OpenCV-android-sdk
          EOF
          echo "sdk.dir=$ANDROID_SDK_ROOT" > cfc/local.properties

      - name: Assemble Debug APK
        working-directory: cfc
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon

      - name: Stage APK
        shell: bash
        run: |
          ver="${{ steps.ver.outputs.version }}"
          mkdir -p dist/release
          src=$(ls cfc/app/build/outputs/apk/debug/*.apk | head -n1)
          cp "$src" "dist/release/CimbarReceiver-arm64-v8a-v${ver}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-receiver
          path: dist/release/CimbarReceiver-arm64-v8a-*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-qt-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        shell: bash
        run: |
          mkdir -p dist/release
          find artifacts -type f \( -name 'CimbarQtSender-windows-x64-*.zip' -o -name 'CimbarReceiver-arm64-v8a-*.apk' \) \
            -exec cp -v {} dist/release/ \;
          ls -la dist/release
          test "$(ls dist/release | wc -l)" -ge 2

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-qt-windows.outputs.version }}
          name: Cimbar bar-code v${{ needs.build-qt-windows.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/CimbarQtSender-windows-x64-*.zip
            dist/release/CimbarReceiver-arm64-v8a-*.apk
          body: |
            ## 发布文件（2）
            | 文件 | 说明 |
            |------|------|
            | `CimbarQtSender-windows-x64-*.zip` | Windows Qt 发送端 |
            | `CimbarReceiver-arm64-v8a-*.apk` | Android 接收端（arm64） |

            ### 用法
            1. 解压 ZIP，运行 `cimbar_qt_sender.exe`
            2. 安装 APK，摄像头对准屏幕接收
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
